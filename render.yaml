services:
  - type: web
    name: iiitbh-mess
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: "mongodb://localhost:27017/iiitbh_mess"
        sync: false
      - key: MONGODB_DB
        value: iiitbh_mess
      - key: ADMIN_PASSWORD
        value: "admin"
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ALLOW_DEMO_CLOCK
        value: "false"
      - key: SESSION_TTL_DAYS
        value: "7"
